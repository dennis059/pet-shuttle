<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛孩接送管理系統</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ea;color:#203a31;font:16px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px 16px 48px}h1{margin:0;font-size:2rem}h2{margin:0 0 16px;font-size:1.25rem}p{line-height:1.55}header p,small{color:#455c52}section{background:#fff;border:1px solid #ddd9ce;border-radius:18px;padding:18px;margin-top:16px}.grid,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:16px 0}.stats div{background:#eaf2ec;border-radius:12px;padding:10px;overflow-wrap:anywhere}.stats strong{display:block;margin-top:5px}label{display:block;font-weight:600}input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{display:block;width:100%;min-width:0;min-height:44px;margin:5px 0 12px;padding:8px;border:1px solid #81958a;border-radius:8px;background:#fff}textarea{resize:vertical}button{min-height:44px;padding:8px 13px;border:1px solid #81958a;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#244f40;color:#fff;border-color:#244f40}.actions{display:flex;gap:8px;flex-wrap:wrap}article{border-top:1px solid #ddd9ce;padding:14px 0}article p{margin:6px 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:1.5em}small{display:block} [hidden]{display:none!important}

header{padding:20px 0}h1{font-size:clamp(1.6rem,6vw,2.5rem)}input[type=checkbox]{appearance:none;display:inline-block;vertical-align:middle;width:24px;min-height:24px;margin:0 7px 0 0;border-radius:50%;padding:0}input[type=checkbox]:checked{background:#244f40;box-shadow:inset 0 0 0 4px white}input[role=switch]{width:42px;border-radius:18px;background:radial-gradient(circle at 11px,#244f40 6px,transparent 7px)}input[role=switch]:checked{background:radial-gradient(circle at 30px,white 6px,transparent 7px),#244f40;box-shadow:none}.ride{padding:10px 0}.car{font-size:.9rem;margin:10px 0;color:#455c52}button:disabled{opacity:.55;cursor:wait}a{color:#244f40}
</style>
<main>
<header><h1>毛孩接送管理系統</h1><p><a href="./legacy.html">舊版接送記帳</a></p></header>
<p id="message" role="status" aria-live="polite">正在連線…</p>
<section id="loginPanel" hidden><h2>登入</h2><form id="login">
<label>電子郵件<input id="email" type="email" autocomplete="username" required></label>
<label>密碼<input id="password" type="password" autocomplete="current-password" required></label>
<button class="primary">登入</button></form></section>
<div id="workspace" hidden>
<div class="actions"><strong id="role"></strong><button id="logout">登出</button></div>
<section><h2 id="bookingTitle">接送預約</h2><div id="bookings"></div><button id="saveWeek" class="primary" hidden>儲存下週需求</button></section>
<section id="recordEditor" hidden><h2 id="formTitle">新增接送</h2>
<form id="entry">
<div class="grid">
<label>日期<input id="date" type="date" required></label>
<label>時間（24 小時制）<input id="time" inputmode="numeric" placeholder="例如 2100" maxlength="5" required></label>
<label>時段<select id="period"><option value="早上">早上</option><option value="白天">白天</option><option value="晚上">晚上</option></select></label>
<label>每趟費用（NT$）<input id="fee" type="number" min="0" step="1" required></label>
</div>
<small>早上、晚上每趟 NT$250，白天可自訂費用。</small>
<label>狗狗數量<input id="dogs" type="number" min="1" step="1" value="1" required></label>
<label>備註<textarea id="note" rows="2"></textarea></label>
<div class="actions"><button class="primary" id="save">新增紀錄</button><button type="button" id="cancel" hidden>取消編輯</button></div>
</form></section>
<section><h2>月結與接送紀錄</h2><label>月份<input id="month" type="month" required></label>
<div class="stats" ><div>趟數<strong id="trips"></strong></div><div>狗狗數<strong id="dogTotal"></strong></div><div>應付金額<strong id="income"></strong></div></div>
<div id="records"></div>
</section>
<section><h2>匯出與備份</h2><div class="actions"><button id="csv">匯出當月 CSV</button><button id="backup">匯出全部 JSON</button><button id="restore" hidden>匯入 JSON</button><button id="localBackup" hidden>下載此裝置的舊版備份</button></div><input id="file" type="file" accept=".json,application/json" hidden></section>
</div></main>
<script type="module" src="./app.mjs"></script>
</html>
